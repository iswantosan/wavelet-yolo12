# YOLOv12 — MaskGuidedDetect (mask-gated forward path) 🚀, AGPL-3.0
# Diagnostic-driven primary novelty after exhaustive in-scope ablation
# showed no significant lift via auxiliary supervision branches.
# Val diagnose on AFB Chen-TB6208 identified hard-negative background
# confusion as the dominant precision failure mode: 54.7% of false
# positives lie >2 box-diameters from any GT.
#
# MaskGuidedDetect attacks this ARCHITECTURALLY (not just via loss):
#   1. A small mask predictor on the P3 neck feature outputs a
#      per-spatial sigmoid foreground gate.
#   2. The P3 feature is GATED in the forward path BEFORE entering
#      the cv2/cv3 detection branches:
#          P3_gated = (1 − α) · P3 + α · (P3 ⊙ mask)
#      where α is a learnable scalar (init 0.1).
#   3. Background locations (low mask) → attenuated features → cv3
#      sees suppressed signal → low predicted score → no FP.
#   4. Foreground locations (high mask) → preserved features → normal
#      detection behaviour.
#
# Unlike AuxSegDetect (parallel branch with loss-only effect), MGD's
# gating is part of the architecture — it remains active at inference
# (no branch drop) and directly suppresses hard-neg activations.
#
# Mask is supervised by the LAB a*-channel pseudo-mask (BCE) inside
# v8DetectionLoss (the same target as AuxSeg), weight `mgd_weight`
# (default 1.0).
#
# Cost vs baseline yolov12s: +~30k params (mask head), +~1% FLOPs
# (gating active at train AND inference).

# Parameters
nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO12-turbo backbone (unchanged)
backbone:
  - [-1, 1, Conv,  [64, 3, 2]]
  - [-1, 1, Conv,  [128, 3, 2, 1, 2]]
  - [-1, 2, C3k2,  [256, False, 0.25]]
  - [-1, 1, Conv,  [256, 3, 2, 1, 4]]
  - [-1, 2, C3k2,  [512, False, 0.25]]
  - [-1, 1, Conv,  [512, 3, 2]]
  - [-1, 4, A2C2f, [512, True, 4]]
  - [-1, 1, Conv,  [1024, 3, 2]]
  - [-1, 4, A2C2f, [1024, True, 1]]

# Head (unchanged) + MaskGuidedDetect (3 scales)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, False, -1]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, A2C2f, [256, False, -1]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, False, -1]]

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]

  - [[14, 17, 20], 1, MaskGuidedDetect, [nc]]   # mask-gated P3 forward path
