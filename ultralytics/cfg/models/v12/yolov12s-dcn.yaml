# YOLOv12 — Deformable Convolution v2 (DCN) at P3 🚀, AGPL-3.0
# Adapts the standard 3×3 grid sampling to bacilli geometry by predicting
# per-spatial-location offsets + modulation gates for each kernel sample
# point. Acid-fast bacilli are rod-shaped with arbitrary orientation —
# square kernels waste capacity on the short axis. DCN learns to align
# the receptive field with the rod's principal axis, providing
# orientation-adaptive feature extraction.
#
# Inserted as a refinement block right after the P3 neck (smallest scale,
# where small rod-shaped bacilli matter most). P4 / P5 keep standard
# convs — bigger objects benefit less from orientation adaptation.
#
# Cost vs baseline yolov12s: +~70k params (1 DCN block at P3 width 128),
# +~1.5% FLOPs. Inference uses DCN too (not dropped at eval).

# Parameters
nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO12-turbo backbone (unchanged)
backbone:
  - [-1, 1, Conv,  [64, 3, 2]]
  - [-1, 1, Conv,  [128, 3, 2, 1, 2]]
  - [-1, 2, C3k2,  [256, False, 0.25]]
  - [-1, 1, Conv,  [256, 3, 2, 1, 4]]
  - [-1, 2, C3k2,  [512, False, 0.25]]
  - [-1, 1, Conv,  [512, 3, 2]]
  - [-1, 4, A2C2f, [512, True, 4]]
  - [-1, 1, Conv,  [1024, 3, 2]]
  - [-1, 4, A2C2f, [1024, True, 1]]

# Head: standard YOLOv12 PAN-FPN + DCNBlock inserted after P3 neck (14)
# Indices shifted by +1 from layer 15 onward due to the DCN insertion.
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 9
  - [[-1, 6], 1, Concat, [1]]                     # 10
  - [-1, 2, A2C2f, [512, False, -1]]              # 11 (neck P4)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 12
  - [[-1, 4], 1, Concat, [1]]                     # 13
  - [-1, 2, A2C2f, [256, False, -1]]              # 14 (raw P3)
  - [-1, 1, DCNBlock, [256]]                      # 15 ← DCN refinement at P3

  - [-1, 1, Conv, [256, 3, 2]]                    # 16 (downsample P3→P4)
  - [[-1, 11], 1, Concat, [1]]                    # 17
  - [-1, 2, A2C2f, [512, False, -1]]              # 18 (P4 output)

  - [-1, 1, Conv, [512, 3, 2]]                    # 19 (downsample P4→P5)
  - [[-1, 8], 1, Concat, [1]]                     # 20
  - [-1, 2, C3k2, [1024, True]]                   # 21 (P5 output)

  - [[15, 18, 21], 1, Detect, [nc]]               # 22  Detect on (DCN'd P3, P4, P5)
