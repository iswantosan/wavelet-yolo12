# YOLOv12 — HDFL (Hierarchical DFL) head 🚀, AGPL-3.0 license
# Drop-in YAML: backbone+neck unchanged, only the final Detect is replaced
# by HDFLDetect. HDFLDetect predicts coarse (16-bin) + fine (16-bin) DFL
# distributions per box side, integrating to 256 effective quantile levels
# instead of standard DFL's 16. Targets the box-regression bottleneck
# identified by diagnose_for_arch.py on AFB Chen-TB6208:
#   mAP@0.5=0.80, mAP@0.7=0.23, mAP@0.9≈0.01 → drop 0.5→0.7 = 0.574.
# Net cost over baseline yolov12s: +0.18% params, +<1% FLOPs.

# Parameters
nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO12-turbo backbone (unchanged)
backbone:
  - [-1, 1, Conv,  [64, 3, 2]]
  - [-1, 1, Conv,  [128, 3, 2, 1, 2]]
  - [-1, 2, C3k2,  [256, False, 0.25]]
  - [-1, 1, Conv,  [256, 3, 2, 1, 4]]
  - [-1, 2, C3k2,  [512, False, 0.25]]
  - [-1, 1, Conv,  [512, 3, 2]]
  - [-1, 4, A2C2f, [512, True, 4]]
  - [-1, 1, Conv,  [1024, 3, 2]]
  - [-1, 4, A2C2f, [1024, True, 1]]

# Head (unchanged) + HDFLDetect (3 scales)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, False, -1]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, A2C2f, [256, False, -1]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, False, -1]]

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]

  - [[14, 17, 20], 1, HDFLDetect, [nc]]   # HDFLDetect — coarse+fine DFL
