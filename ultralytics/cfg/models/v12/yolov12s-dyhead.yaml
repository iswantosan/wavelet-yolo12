# YOLOv12s with Dynamic Head (DyHead) — Dai et al., CVPR 2021.
# Architecture identical to baseline yolov12s, only the final Detect is
# replaced with DyHeadDetect, which stacks 2 DyHead attention blocks
# (scale-aware + spatial-aware + task-aware) on the multi-scale neck
# outputs before the regression / classification branches.
# Backbone & neck are unchanged → full pretrained transfer for everything
# except the new DyHead module + head conv branches.
# Filename suffix 's' is parsed by Ultralytics regex 'yolov?\d+([nslmx])'
# so scale='s' is auto-detected.

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:                                             # IDENTICAL to baseline
  - [-1, 1, Conv,     [64, 3, 2]]                     # 0-P1/2
  - [-1, 1, Conv,     [128, 3, 2, 1, 2]]              # 1-P2/4
  - [-1, 2, C3k2,     [256, False, 0.25]]             # 2
  - [-1, 1, Conv,     [256, 3, 2]]                    # 3-P3/8
  - [-1, 2, C3k2,     [512, False, 0.25]]             # 4
  - [-1, 1, Conv,     [512, 3, 2]]                    # 5-P4/16
  - [-1, 4, A2C2f,    [512, True, 4]]                 # 6
  - [-1, 1, Conv,     [1024, 3, 2]]                   # 7-P5/32
  - [-1, 4, A2C2f,    [1024, True, 1]]                # 8

head:                                                 # IDENTICAL to baseline
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]        # 9
  - [[-1, 6], 1, Concat, [1]]                         # 10
  - [-1, 2, A2C2f, [512, False, -1]]                  # 11

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]        # 12
  - [[-1, 4], 1, Concat, [1]]                         # 13
  - [-1, 2, A2C2f, [256, False, -1]]                  # 14  P3

  - [-1, 1, Conv, [256, 3, 2]]                        # 15
  - [[-1, 11], 1, Concat, [1]]                        # 16
  - [-1, 2, A2C2f, [512, False, -1]]                  # 17  P4

  - [-1, 1, Conv, [512, 3, 2]]                        # 18
  - [[-1, 8], 1, Concat, [1]]                         # 19
  - [-1, 2, C3k2, [1024, True]]                       # 20  P5

  # Replace Detect with DyHeadDetect (nc, num_dyhead_blocks=2).
  - [[14, 17, 20], 1, DyHeadDetect, [nc, 2]]          # P3, P4, P5 with stacked DyHead attn
