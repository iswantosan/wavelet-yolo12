# Wavelet-YOLOv12s — P2 head extension + WaveUp at all upsample slots.
# Strategy: highest-probability route to actually beating the baseline.
#
# Design principles:
#   1. Backbone IDENTICAL to baseline yolov12s — full pretrained transfer.
#   2. Original 3-scale head (P3/P4/P5) IDENTICAL to baseline — head
#      layers 9-20 keep their pretrained weights, only the two nn.Upsample
#      ops are swapped for WaveUp (no pretrained weights to lose).
#   3. P2 detection head added as a TAP from the existing P3 intermediate
#      (layer 14). This avoids the index shift that broke pretrained head
#      transfer in earlier P2-head attempts.
#   4. WaveUp init = nearest-neighbour upsample → step-0 model is identical
#      to a baseline+P2head model. Wavelet learning is purely additive.
#
# Detection scales: P2 (160x160), P3 (80x80), P4 (40x40), P5 (20x20) at
# imgsz=640. The P2 head is the primary mAP lever for small objects (AFB).
# WaveUp carries the wavelet contribution for the paper narrative without
# putting any wavelet on the critical pretrained backbone path.
#
# Filename suffix 's' is parsed by Ultralytics regex 'yolov?\d+([nslmx])'
# so scale='s' is auto-detected.

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:                                             # IDENTICAL to baseline
  - [-1, 1, Conv,     [64, 3, 2]]                     # 0-P1/2
  - [-1, 1, Conv,     [128, 3, 2, 1, 2]]              # 1-P2/4
  - [-1, 2, C3k2,     [256, False, 0.25]]             # 2  (P2 backbone — P2 head source)
  - [-1, 1, Conv,     [256, 3, 2]]                    # 3-P3/8
  - [-1, 2, C3k2,     [512, False, 0.25]]             # 4
  - [-1, 1, Conv,     [512, 3, 2]]                    # 5-P4/16
  - [-1, 4, A2C2f,    [512, True, 4]]                 # 6
  - [-1, 1, Conv,     [1024, 3, 2]]                   # 7-P5/32
  - [-1, 4, A2C2f,    [1024, True, 1]]                # 8

head:
  # --- Original 3-scale head (layers 9-20) — same shape/indices as baseline,
  # except nn.Upsample is replaced with WaveUp. Pretrained head weights
  # for layers 10, 11, 13, 14, 15-20 still load by index+shape.
  - [-1, 1, WaveUp, []]                               # 9   (was nn.Upsample)
  - [[-1, 6], 1, Concat, [1]]                         # 10
  - [-1, 2, A2C2f, [512, False, -1]]                  # 11

  - [-1, 1, WaveUp, []]                               # 12  (was nn.Upsample)
  - [[-1, 4], 1, Concat, [1]]                         # 13
  - [-1, 2, A2C2f, [256, False, -1]]                  # 14  P3 detect (also P2-head source)

  - [-1, 1, Conv, [256, 3, 2]]                        # 15
  - [[-1, 11], 1, Concat, [1]]                        # 16
  - [-1, 2, A2C2f, [512, False, -1]]                  # 17  P4 detect

  - [-1, 1, Conv, [512, 3, 2]]                        # 18
  - [[-1, 8], 1, Concat, [1]]                         # 19
  - [-1, 2, C3k2, [1024, True]]                       # 20  P5 detect

  # --- NEW: P2 head tap from layer 14 (P3 intermediate). Only these 3 new
  # layers + the 4-input Detect have no pretrained match.
  - [14, 1, WaveUp, []]                               # 21  P3 -> P2 res
  - [[-1, 2], 1, Concat, [1]]                         # 22  concat backbone P2 (layer 2)
  - [-1, 2, A2C2f, [128, False, -1]]                  # 23  P2 detect

  - [[23, 14, 17, 20], 1, Detect, [nc]]               # P2, P3, P4, P5
