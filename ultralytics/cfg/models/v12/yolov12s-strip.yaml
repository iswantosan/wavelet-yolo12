# YOLOv12-s + Strip Attention
# Strip attention block injected at the end of each pyramid level in the head
# (after each A2C2f / C3k2 fusion) to bias features toward elongated rod-shaped
# AFB targets. Scale-detection regex resolves scale 's' from the 's-' suffix
# below (depth=0.50 width=0.50 max_ch=1024 → ~9.1M base params + StripAttn overhead).

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv,  [64, 3, 2]]               # 0-P1/2
  - [-1, 1, Conv,  [128, 3, 2, 1, 2]]        # 1-P2/4
  - [-1, 2, C3k2,  [256, False, 0.25]]
  - [-1, 1, Conv,  [256, 3, 2, 1, 4]]        # 3-P3/8
  - [-1, 2, C3k2,  [512, False, 0.25]]
  - [-1, 1, Conv,  [512, 3, 2]]              # 5-P4/16
  - [-1, 4, A2C2f, [512, True, 4]]
  - [-1, 1, Conv,  [1024, 3, 2]]             # 7-P5/32
  - [-1, 4, A2C2f, [1024, True, 1]]          # 8

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, False, -1]]         # 11

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, A2C2f, [256, False, -1]]         # 14
  - [-1, 1, StripAttnBlock, [256]]           # 15  ← strip attn at P3 (small obj)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, False, -1]]         # 18
  - [-1, 1, StripAttnBlock, [512]]           # 19  ← strip attn at P4

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]              # 22 (P5/32-large)

  - [[15, 19, 22], 1, Detect, [nc]]
