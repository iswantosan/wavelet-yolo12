# YOLOv12 — Wavelet-Regularized Regression Head (WaveReg-Head) 🚀, AGPL-3.0 license
# Identical to yolov12.yaml backbone+neck. Only the detection head is swapped
# from Detect → WaveRegDetect, which routes Haar-DWT HF sub-bands into the
# regression branch (cv2) of the head. Classification branch (cv3) is unchanged.
#
# Motivation: failure-mode analysis on Chen-TB6208 (2026-06-04) shows the
# bottleneck is box-regression precision (mean IoU 0.683, mAP@0.9≈0.01),
# not detection or classification. Probe confirms HF SNR at neck output of
# 1.92×/1.65×/0.95× at P3/P4/P5 — strong signal at the fine scales that
# drive localization.

# Parameters
nc: 80
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO12-turbo backbone (unchanged)
backbone:
  - [-1, 1, Conv,  [64, 3, 2]]                  # 0-P1/2
  - [-1, 1, Conv,  [128, 3, 2, 1, 2]]           # 1-P2/4
  - [-1, 2, C3k2,  [256, False, 0.25]]
  - [-1, 1, Conv,  [256, 3, 2, 1, 4]]           # 3-P3/8
  - [-1, 2, C3k2,  [512, False, 0.25]]
  - [-1, 1, Conv,  [512, 3, 2]]                 # 5-P4/16
  - [-1, 4, A2C2f, [512, True, 4]]
  - [-1, 1, Conv,  [1024, 3, 2]]                # 7-P5/32
  - [-1, 4, A2C2f, [1024, True, 1]]             # 8

# YOLO12-turbo head (unchanged) + WaveRegDetect at the end
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]                   # cat backbone P4
  - [-1, 2, A2C2f, [512, False, -1]]            # 11

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]                   # cat backbone P3
  - [-1, 2, A2C2f, [256, False, -1]]            # 14

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]                  # cat head P4
  - [-1, 2, A2C2f, [512, False, -1]]            # 17

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]                   # cat head P5
  - [-1, 2, C3k2, [1024, True]]                 # 20 (P5/32-large)

  - [[14, 17, 20], 1, WaveRegDetect, [nc]]      # WaveReg-Head(P3, P4, P5)
