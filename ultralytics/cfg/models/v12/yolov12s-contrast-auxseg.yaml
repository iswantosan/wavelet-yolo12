# YOLOv12 — ContrastiveAuxSegDetect head (DUAL aux supervision) 🚀, AGPL-3.0
# Combines two diagnostic-driven mechanisms on the SAME P3 neck feature,
# attacking orthogonal failure modes of the AFB Chen-TB6208 baseline
# (val mAP50 = 0.85, P=R=0.77):
#
#   1. AuxSeg branch  : dense fg/bg BCE supervision via LAB a*-channel
#       pseudo-mask. RECALL-oriented — confirmed lift recall by 2.4 pp
#       (0.771 → 0.795) in prior single-arch experiments. Attacks missed
#       objects (FN reduction).
#
#   2. Contrast branch: L2-normalised projection + SupCon-style InfoNCE
#       between in-GT-box positives (LAB a*-filtered) and outside-GT-box
#       negatives. PRECISION-oriented — pushes bacilli features to
#       cluster and background features to scatter in embedding space.
#       Attacks the 54.7% hard-neg background FPs identified in the val
#       diagnose.
#
# The two losses are added to the detection loss with separate weights
# (auxseg_weight=1.0, contrast_weight=0.3 by default). Inference: both
# auxiliary branches are dropped (zero overhead at val/test).
#
# Cost vs baseline yolov12s: +~60k params (auxseg + contrast heads),
# +<1% FLOPs.
#
# Loss-side hyperparameters (override via train kwargs):
#   auxseg_weight   : 1.0
#   contrast_weight : 0.3
#   contrast_temp   : 0.1
#   contrast_n_neg  : 32

# Parameters
nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO12-turbo backbone (unchanged)
backbone:
  - [-1, 1, Conv,  [64, 3, 2]]
  - [-1, 1, Conv,  [128, 3, 2, 1, 2]]
  - [-1, 2, C3k2,  [256, False, 0.25]]
  - [-1, 1, Conv,  [256, 3, 2, 1, 4]]
  - [-1, 2, C3k2,  [512, False, 0.25]]
  - [-1, 1, Conv,  [512, 3, 2]]
  - [-1, 4, A2C2f, [512, True, 4]]
  - [-1, 1, Conv,  [1024, 3, 2]]
  - [-1, 4, A2C2f, [1024, True, 1]]

# Head (unchanged) + ContrastiveAuxSegDetect (3 scales)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, False, -1]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, A2C2f, [256, False, -1]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, False, -1]]

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]

  - [[14, 17, 20], 1, ContrastiveAuxSegDetect, [nc]]   # AuxSeg + Contrastive on P3
