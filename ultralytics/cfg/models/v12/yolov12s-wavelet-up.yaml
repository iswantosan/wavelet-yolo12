# Wavelet-YOLOv12s — Strategy C: WaveUp replaces nn.Upsample in the neck.
# Backbone is UNCHANGED from baseline. The two nearest-neighbour upsample
# layers in the top-down path of the neck are replaced with WaveUp — a
# learnable inverse-Haar upsampler that predicts LH/HL/HH coefficients from
# the input feature and synthesises a 2x upsampled output.
# WaveUp's residual gate (alpha) and hf_pred are both zero-init, so at step 0
# the output is the nearest-neighbour upsample EXACTLY — pretrained weights
# all match by index and shape.
# Filename suffix 's' is parsed by Ultralytics regex 'yolov?\d+([nslmx])'
# so scale='s' is auto-detected.

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv,     [64, 3, 2]]               # 0-P1/2
  - [-1, 1, Conv,     [128, 3, 2, 1, 2]]        # 1-P2/4
  - [-1, 2, C3k2,     [256, False, 0.25]]       # 2
  - [-1, 1, Conv,     [256, 3, 2]]              # 3-P3/8
  - [-1, 2, C3k2,     [512, False, 0.25]]       # 4
  - [-1, 1, Conv,     [512, 3, 2]]              # 5-P4/16
  - [-1, 4, A2C2f,    [512, True, 4]]           # 6
  - [-1, 1, Conv,     [1024, 3, 2]]             # 7-P5/32
  - [-1, 4, A2C2f,    [1024, True, 1]]          # 8

head:
  - [-1, 1, WaveUp, []]                         # 9   (replaces nn.Upsample)
  - [[-1, 6], 1, Concat, [1]]                   # 10
  - [-1, 2, A2C2f, [512, False, -1]]            # 11

  - [-1, 1, WaveUp, []]                         # 12  (replaces nn.Upsample)
  - [[-1, 4], 1, Concat, [1]]                   # 13
  - [-1, 2, A2C2f, [256, False, -1]]            # 14  P3 detect

  - [-1, 1, Conv, [256, 3, 2]]                  # 15
  - [[-1, 11], 1, Concat, [1]]                  # 16
  - [-1, 2, A2C2f, [512, False, -1]]            # 17  P4 detect

  - [-1, 1, Conv, [512, 3, 2]]                  # 18
  - [[-1, 8], 1, Concat, [1]]                   # 19
  - [-1, 2, C3k2, [1024, True]]                 # 20  P5 detect

  - [[14, 17, 20], 1, Detect, [nc]]             # P3, P4, P5
