# YOLOv12 — P3+P4 only (drop P5 head) 🚀, AGPL-3.0 license
# Motivation: diagnostic analysis on AFB Chen-TB6208 (2026-06-05) shows
# P5-typical objects (≥96 px diameter) account for only 2.0% of GT.
# Removing the P5 detection branch yields a smaller / faster model with
# mAP-neutral expected impact for this domain.
# Backbone unchanged. Head removes the P3→P4→P5 downsample path and the
# 3rd Detect input. Detect is now 2-scale ([14, 17]).

# Parameters
nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO12-turbo backbone (unchanged — still produces P3/P4/P5).
backbone:
  - [-1, 1, Conv,  [64, 3, 2]]
  - [-1, 1, Conv,  [128, 3, 2, 1, 2]]
  - [-1, 2, C3k2,  [256, False, 0.25]]
  - [-1, 1, Conv,  [256, 3, 2, 1, 4]]
  - [-1, 2, C3k2,  [512, False, 0.25]]
  - [-1, 1, Conv,  [512, 3, 2]]
  - [-1, 4, A2C2f, [512, True, 4]]
  - [-1, 1, Conv,  [1024, 3, 2]]
  - [-1, 4, A2C2f, [1024, True, 1]]

# Head (P5→P4 fused via upsample; final Detect is P3+P4 only).
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 9  — upsample backbone P5 (8)
  - [[-1, 6], 1, Concat, [1]]                     # 10
  - [-1, 2, A2C2f, [512, False, -1]]              # 11 — neck P4

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 12
  - [[-1, 4], 1, Concat, [1]]                     # 13
  - [-1, 2, A2C2f, [256, False, -1]]              # 14 — P3 (Detect input 0)

  - [-1, 1, Conv, [256, 3, 2]]                    # 15
  - [[-1, 11], 1, Concat, [1]]                    # 16
  - [-1, 2, A2C2f, [512, False, -1]]              # 17 — P4 (Detect input 1)

  - [[14, 17], 1, Detect, [nc]]                   # 18 — 2-scale Detect
