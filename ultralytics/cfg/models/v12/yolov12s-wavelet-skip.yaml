# Wavelet-YOLOv12s — Strategy B: HF skip injection from backbone P2 to neck P3.
# Backbone is UNCHANGED from baseline. An additional WaveHFSkip branch reads
# the backbone P2 feature (layer 2) and produces a low-channel HF feature
# map at P3 resolution. This is concatenated with the existing P3 concat in
# the neck, injecting input-side high-frequency detail directly into the P3
# detection scale.
# WaveHFSkip's projection is zero-init, so at step 0 the new concat'd
# channels contribute 0 → downstream layers see the same input distribution
# as baseline.
# Filename suffix 's' is parsed by Ultralytics regex 'yolov?\d+([nslmx])'
# so scale='s' is auto-detected.

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv,     [64, 3, 2]]               # 0-P1/2
  - [-1, 1, Conv,     [128, 3, 2, 1, 2]]        # 1-P2/4
  - [-1, 2, C3k2,     [256, False, 0.25]]       # 2  (P2 backbone — HF skip source)
  - [-1, 1, Conv,     [256, 3, 2]]              # 3-P3/8
  - [-1, 2, C3k2,     [512, False, 0.25]]       # 4  (P3 backbone)
  - [-1, 1, Conv,     [512, 3, 2]]              # 5-P4/16
  - [-1, 4, A2C2f,    [512, True, 4]]           # 6
  - [-1, 1, Conv,     [1024, 3, 2]]             # 7-P5/32
  - [-1, 4, A2C2f,    [1024, True, 1]]          # 8

head:
  - [2, 1, WaveHFSkip, [64]]                    # 9  HF branch: P2 -> P3 res, 64 ch (pre-scale)

  - [8, 1, nn.Upsample, [None, 2, "nearest"]]   # 10
  - [[-1, 6], 1, Concat, [1]]                   # 11
  - [-1, 2, A2C2f, [512, False, -1]]            # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 13
  - [[-1, 4, 9], 1, Concat, [1]]                # 14  P3 concat + HF skip
  - [-1, 2, A2C2f, [256, False, -1]]            # 15  P3 detect

  - [-1, 1, Conv, [256, 3, 2]]                  # 16
  - [[-1, 12], 1, Concat, [1]]                  # 17
  - [-1, 2, A2C2f, [512, False, -1]]            # 18  P4 detect

  - [-1, 1, Conv, [512, 3, 2]]                  # 19
  - [[-1, 8], 1, Concat, [1]]                   # 20
  - [-1, 2, C3k2, [1024, True]]                 # 21  P5 detect

  - [[15, 18, 21], 1, Detect, [nc]]             # P3, P4, P5
