# Wavelet-YOLOv12s with P2 detection head — for very small objects (AFB).
# Two contributions stacked:
#   1. WaveDown at P2/4 and P3/8 — lossless multi-band downsampling that
#      preserves the high-frequency signal small bacilli depend on.
#   2. Extra detection head at P2/4 (160x160 at imgsz=640) — proven small-
#      object fix; pairs naturally with WaveDown's HF preservation.
# Filename suffix 's' is parsed by Ultralytics regex 'yolov?\d+([nslmx])'
# so scale='s' is auto-detected.

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv,     [64, 3, 2]]               # 0-P1/2
  - [-1, 1, WaveDown, [128]]                    # 1-P2/4   (wavelet)
  - [-1, 2, C3k2,     [256, False, 0.25]]       # 2
  - [-1, 1, WaveDown, [256]]                    # 3-P3/8   (wavelet)
  - [-1, 2, C3k2,     [512, False, 0.25]]       # 4
  - [-1, 1, Conv,     [512, 3, 2]]              # 5-P4/16
  - [-1, 4, A2C2f,    [512, True, 4]]           # 6
  - [-1, 1, Conv,     [1024, 3, 2]]             # 7-P5/32
  - [-1, 4, A2C2f,    [1024, True, 1]]          # 8

head:
  # FPN top-down: P5 -> P4 -> P3 -> P2
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 9
  - [[-1, 6], 1, Concat, [1]]                   # 10
  - [-1, 2, A2C2f, [512, False, -1]]            # 11  P4 intermediate

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 12
  - [[-1, 4], 1, Concat, [1]]                   # 13
  - [-1, 2, A2C2f, [256, False, -1]]            # 14  P3 intermediate

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 15
  - [[-1, 2], 1, Concat, [1]]                   # 16  concat with backbone P2 (layer 2)
  - [-1, 2, A2C2f, [128, False, -1]]            # 17  P2 detect

  # PAN bottom-up: P2 -> P3 -> P4 -> P5
  - [-1, 1, Conv, [128, 3, 2]]                  # 18
  - [[-1, 14], 1, Concat, [1]]                  # 19
  - [-1, 2, A2C2f, [256, False, -1]]            # 20  P3 detect

  - [-1, 1, Conv, [256, 3, 2]]                  # 21
  - [[-1, 11], 1, Concat, [1]]                  # 22
  - [-1, 2, A2C2f, [512, False, -1]]            # 23  P4 detect

  - [-1, 1, Conv, [512, 3, 2]]                  # 24
  - [[-1, 8], 1, Concat, [1]]                   # 25
  - [-1, 2, C3k2, [1024, True]]                 # 26  P5 detect

  - [[17, 20, 23, 26], 1, Detect, [nc]]         # P2, P3, P4, P5
