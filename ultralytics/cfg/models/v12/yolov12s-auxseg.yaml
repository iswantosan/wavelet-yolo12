# YOLOv12 — AuxSegDetect head (auxiliary fg/bg segmentation supervision) 🚀, AGPL-3.0
# Diagnostic-driven primary novelty for AFB Chen-TB6208 (val mAP50 ≈ 0.85):
# 54.7% of false positives are >2 box-diameters from any GT — hard-negative
# background confusion dominates. AuxSegDetect adds a parallel BCE-supervised
# segmentation head on the P3 neck feature, with pseudo-mask derived from
# LAB a*-channel + GT-box AND. Inference-only branch (zero cost at val/test).
#
# Cost: +~30k params, +<1% FLOPs, +1 BCE term in training loss.
# Loss hyperparameter: `auxseg_weight` (default 1.0) — exposed via overrides.

# Parameters
nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO12-turbo backbone (unchanged)
backbone:
  - [-1, 1, Conv,  [64, 3, 2]]
  - [-1, 1, Conv,  [128, 3, 2, 1, 2]]
  - [-1, 2, C3k2,  [256, False, 0.25]]
  - [-1, 1, Conv,  [256, 3, 2, 1, 4]]
  - [-1, 2, C3k2,  [512, False, 0.25]]
  - [-1, 1, Conv,  [512, 3, 2]]
  - [-1, 4, A2C2f, [512, True, 4]]
  - [-1, 1, Conv,  [1024, 3, 2]]
  - [-1, 4, A2C2f, [1024, True, 1]]

# Head (unchanged) + AuxSegDetect (3 scales)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, False, -1]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, A2C2f, [256, False, -1]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, False, -1]]

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]

  - [[14, 17, 20], 1, AuxSegDetect, [nc]]   # AuxSegDetect — dense fg/bg supervision on P3
