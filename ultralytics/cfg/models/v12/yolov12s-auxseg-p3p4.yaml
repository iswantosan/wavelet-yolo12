# YOLOv12 — AuxSegDetect + drop P5 (recommended primary config) 🚀, AGPL-3.0
# Two diagnostic-driven modifications for AFB Chen-TB6208 (baseline val
# mAP50 = 0.85):
#   1. AuxSegDetect — auxiliary segmentation supervision attacks the
#      hard-negative background confusion (54.7% of FPs >2 box-diam from
#      any GT). Pseudo-mask from LAB a* + GT-box AND.
#   2. Drop P5 — P5-typical objects are only 2.3% of GT, P5 head removed
#      for efficiency.
#
# Combined cost vs baseline yolov12s: −P5 conv path, +auxseg branch.

# Parameters
nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO12-turbo backbone (unchanged)
backbone:
  - [-1, 1, Conv,  [64, 3, 2]]
  - [-1, 1, Conv,  [128, 3, 2, 1, 2]]
  - [-1, 2, C3k2,  [256, False, 0.25]]
  - [-1, 1, Conv,  [256, 3, 2, 1, 4]]
  - [-1, 2, C3k2,  [512, False, 0.25]]
  - [-1, 1, Conv,  [512, 3, 2]]
  - [-1, 4, A2C2f, [512, True, 4]]
  - [-1, 1, Conv,  [1024, 3, 2]]
  - [-1, 4, A2C2f, [1024, True, 1]]

# Head: P5→P4 fused via upsample; final AuxSegDetect is P3+P4 only.
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 9  — upsample backbone P5 (8)
  - [[-1, 6], 1, Concat, [1]]                     # 10
  - [-1, 2, A2C2f, [512, False, -1]]              # 11 — neck P4

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 12
  - [[-1, 4], 1, Concat, [1]]                     # 13
  - [-1, 2, A2C2f, [256, False, -1]]              # 14 — P3 (Detect input 0)

  - [-1, 1, Conv, [256, 3, 2]]                    # 15
  - [[-1, 11], 1, Concat, [1]]                    # 16
  - [-1, 2, A2C2f, [512, False, -1]]              # 17 — P4 (Detect input 1)

  - [[14, 17], 1, AuxSegDetect, [nc]]             # 18 — 2-scale AuxSegDetect
