# YOLOv12s with AKConv (Alterable Kernel Convolution, Ai et al., 2023).
# Replaces the two mid-backbone stride-2 downsampling convs (P2→P3 and
# P3→P4) with AKConv. AKConv has N=9 adaptive sampling points per output
# position with learnable 2D offsets, so the effective kernel can take an
# arbitrary shape — useful for rod-shaped targets like acid-fast bacilli
# whose orientation varies per instance.
#
# Backbone P1, P4→P5, neck, and head are unchanged → most pretrained
# weights still transfer; only the two AKConv layers are trained from
# scratch (each has ~150K params, slightly more than the Conv 3×3 stride 2
# it replaces due to the offset predictor).
#
# Filename suffix 's' is parsed by Ultralytics regex 'yolov?\d+([nslmx])'
# so scale='s' is auto-detected.

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv,     [64, 3, 2]]               # 0-P1/2
  - [-1, 1, Conv,     [128, 3, 2, 1, 2]]        # 1-P2/4
  - [-1, 2, C3k2,     [256, False, 0.25]]       # 2
  - [-1, 1, AKConv,   [256, 9, 2]]              # 3-P3/8   (AKConv: c2=256, N=9, stride=2)
  - [-1, 2, C3k2,     [512, False, 0.25]]       # 4
  - [-1, 1, AKConv,   [512, 9, 2]]              # 5-P4/16  (AKConv: c2=512, N=9, stride=2)
  - [-1, 4, A2C2f,    [512, True, 4]]           # 6
  - [-1, 1, Conv,     [1024, 3, 2]]             # 7-P5/32
  - [-1, 4, A2C2f,    [1024, True, 1]]          # 8

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 9
  - [[-1, 6], 1, Concat, [1]]                   # 10
  - [-1, 2, A2C2f, [512, False, -1]]            # 11

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 12
  - [[-1, 4], 1, Concat, [1]]                   # 13
  - [-1, 2, A2C2f, [256, False, -1]]            # 14  P3

  - [-1, 1, Conv, [256, 3, 2]]                  # 15
  - [[-1, 11], 1, Concat, [1]]                  # 16
  - [-1, 2, A2C2f, [512, False, -1]]            # 17  P4

  - [-1, 1, Conv, [512, 3, 2]]                  # 18
  - [[-1, 8], 1, Concat, [1]]                   # 19
  - [-1, 2, C3k2, [1024, True]]                 # 20  P5

  - [[14, 17, 20], 1, Detect, [nc]]             # P3, P4, P5
