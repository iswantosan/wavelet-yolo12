# Wavelet-YOLOv12s — WaveDown at both P2/4 and P3/8 transitions.
# Same neck/head as baseline (P3/P4/P5 detection) — isolates the effect of
# wavelet downsampling without the extra P2 head. Use this as the wavelet-
# only ablation against:
#   - baseline yolov12s (no wavelet, no P2 head)
#   - yolov12s-wavelet-p3 (wavelet only at P3)
#   - yolov12s-wavelet-p2 (wavelet at P2+P3 AND extra P2 head)
# Filename suffix 's' is parsed by Ultralytics regex 'yolov?\d+([nslmx])'
# so scale='s' is auto-detected.

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv,     [64, 3, 2]]               # 0-P1/2
  - [-1, 1, WaveDown, [128]]                    # 1-P2/4   (wavelet)
  - [-1, 2, C3k2,     [256, False, 0.25]]       # 2
  - [-1, 1, WaveDown, [256]]                    # 3-P3/8   (wavelet)
  - [-1, 2, C3k2,     [512, False, 0.25]]       # 4
  - [-1, 1, Conv,     [512, 3, 2]]              # 5-P4/16
  - [-1, 4, A2C2f,    [512, True, 4]]           # 6
  - [-1, 1, Conv,     [1024, 3, 2]]             # 7-P5/32
  - [-1, 4, A2C2f,    [1024, True, 1]]          # 8

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 9
  - [[-1, 6], 1, Concat, [1]]                   # 10
  - [-1, 2, A2C2f, [512, False, -1]]            # 11

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 12
  - [[-1, 4], 1, Concat, [1]]                   # 13
  - [-1, 2, A2C2f, [256, False, -1]]            # 14  P3 detect

  - [-1, 1, Conv, [256, 3, 2]]                  # 15
  - [[-1, 11], 1, Concat, [1]]                  # 16
  - [-1, 2, A2C2f, [512, False, -1]]            # 17  P4 detect

  - [-1, 1, Conv, [512, 3, 2]]                  # 18
  - [[-1, 8], 1, Concat, [1]]                   # 19
  - [-1, 2, C3k2, [1024, True]]                 # 20  P5 detect

  - [[14, 17, 20], 1, Detect, [nc]]             # P3, P4, P5
