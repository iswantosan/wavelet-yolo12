# YOLOv12 — WaveReg-Head P3-only 🚀, AGPL-3.0 license
# Scale-selective variant of WaveReg-Head: HF wavelet injection ONLY at P3
# (where probe SNR=1.92×). P4 (1.65×, borderline) and P5 (0.95×, noise)
# are bypassed — feature passes through unchanged to cv2.
#
# V2 all-scales injection caused precision↑ recall↓ (mAP50-95 went DOWN
# by 0.008 vs baseline) — hypothesis: P5 HF is noise that biases the
# model toward edge-rich (often non-bacilli smear) regions. This variant
# restricts injection to the scale with empirically strongest signal.

# Parameters
nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO12-turbo backbone (unchanged)
backbone:
  - [-1, 1, Conv,  [64, 3, 2]]
  - [-1, 1, Conv,  [128, 3, 2, 1, 2]]
  - [-1, 2, C3k2,  [256, False, 0.25]]
  - [-1, 1, Conv,  [256, 3, 2, 1, 4]]
  - [-1, 2, C3k2,  [512, False, 0.25]]
  - [-1, 1, Conv,  [512, 3, 2]]
  - [-1, 4, A2C2f, [512, True, 4]]
  - [-1, 1, Conv,  [1024, 3, 2]]
  - [-1, 4, A2C2f, [1024, True, 1]]

# Head (unchanged) + WaveRegDetectP3 (P3-only injection)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, False, -1]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, A2C2f, [256, False, -1]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, False, -1]]

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]

  - [[14, 17, 20], 1, WaveRegDetectP3, [nc]]   # P3-only HF injection
