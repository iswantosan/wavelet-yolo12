# Wavelet-YOLOv12s — Strategy D: TextureGate at P3 + P4 detection-head inputs.
#
# Motivation (Chen-split diagnosis, 2026-06-03): the baseline yolov12s
# bottleneck is hard-negative discrimination on textured/smear backgrounds
# (FPs cluster in atypical-staining regions, recall ceiling ≈ 92%, TP-IoU
# distribution is already healthy). Wavelet HF augmentation cannot help
# because the HF prior SNR is only ~1.5×.
#
# TextureGate attacks the diagnosed bottleneck directly: a per-scale spatial
# gate, weakly supervised by GT-box-derived foreground masks, learns to
# suppress feature responses in background-texture regions before the Detect
# head consumes them. Identity init (last conv zeroed) guarantees the model
# starts as an exact baseline; the gate can only learn to attenuate, never
# add spurious signal.
#
# Auxiliary BCE loss is wired up automatically in DetectionModel.init_criterion
# whenever a TextureGate module is present, via v8DetectionLossWithTexGate.
# Hyperparameters: tex_gate_weight (default 0.5), tex_pos_weight (default 4.0).
#
# Filename suffix 's' is parsed by Ultralytics regex 'yolov?\d+([nslmx])'
# so scale='s' is auto-detected.

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv,  [64, 3, 2]]                      # 0-P1/2
  - [-1, 1, Conv,  [128, 3, 2, 1, 2]]               # 1-P2/4
  - [-1, 2, C3k2,  [256, False, 0.25]]              # 2
  - [-1, 1, Conv,  [256, 3, 2]]                     # 3-P3/8
  - [-1, 2, C3k2,  [512, False, 0.25]]              # 4
  - [-1, 1, Conv,  [512, 3, 2]]                     # 5-P4/16
  - [-1, 4, A2C2f, [512, True, 4]]                  # 6
  - [-1, 1, Conv,  [1024, 3, 2]]                    # 7-P5/32
  - [-1, 4, A2C2f, [1024, True, 1]]                 # 8

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]      # 9
  - [[-1, 6], 1, Concat, [1]]                       # 10
  - [-1, 2, A2C2f, [512, False, -1]]                # 11

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]      # 12
  - [[-1, 4], 1, Concat, [1]]                       # 13
  - [-1, 2, A2C2f, [256, False, -1]]                # 14  P3 raw

  - [-1, 1, Conv, [256, 3, 2]]                      # 15
  - [[-1, 11], 1, Concat, [1]]                      # 16
  - [-1, 2, A2C2f, [512, False, -1]]                # 17  P4 raw

  - [-1, 1, Conv, [512, 3, 2]]                      # 18
  - [[-1, 8], 1, Concat, [1]]                       # 19
  - [-1, 2, C3k2, [1024, True]]                     # 20  P5 detect (no gate at stride 32 — bacilli sub-pixel)

  - [14, 1, TextureGate, [256]]                     # 21  P3 gate (stride 8)
  - [17, 1, TextureGate, [512]]                     # 22  P4 gate (stride 16)

  - [[21, 22, 20], 1, Detect, [nc]]                 # gated-P3, gated-P4, P5
